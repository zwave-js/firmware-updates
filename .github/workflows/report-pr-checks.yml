name: 'Z-Wave Bot: Report PR check results'

on:
  workflow_run:
    workflows: ['Test and Release']
    types: [completed]

jobs:
  report:
    name: Report check results
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Report check results
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const { default: action } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/report-pr-checks.mts`
            );
            await action({github, context});
